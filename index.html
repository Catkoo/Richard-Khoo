<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Maintenance | Richard Khoo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #111;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.2rem;
        max-width: 600px;
        opacity: 0.85;
        line-height: 1.6;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.9rem;
        opacity: 0.6;
      }

  <body>
    <h1>🚧 Under Maintenance</h1>
    <p>
      Hello! My website is currently undergoing scheduled maintenance.<br />
      I’m working on some improvements, updates, and design refreshes<br />
      to give you a better and more delightful experience.
    </p>
    <p>Thank you for your patience. Please check back soon!</p>
    <footer>&copy; <span id="year"></span> Richard Khoo</footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

</html>
